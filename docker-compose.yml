services:
  tradingagents:
    container_name: tradingagents
    build: .
    env_file:
      - .env
    volumes:
      - /volume1/Docker/TradingAgents:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  ollama:
    container_name: tradingagents-ollama
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    container_name: tradingagents-tradingagents-ollama
    build: .
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
    volumes:
      - /volume1/Docker/TradingAgents:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama
